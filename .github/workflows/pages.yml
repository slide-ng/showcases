name: Pages

# Builds every deck and publishes the gallery to GitHub Pages (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile on purpose: the showcases always build with the latest slide.ng.
      - run: npm install --no-audit --no-fund
      # Chromium makes the PDFs of the decks with `download: true` and the Open Graph pictures.
      - run: npx playwright-core install --with-deps chromium
      - run: echo "CHROME_PATH=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
          SLIDE_NG_NO_SANDBOX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
