    <rect x="650" y="150" width="270" height="130" rx="12" fill="#1f2329"/><text x="674" y="186">Churn</text><text x="674" y="244" font-size="44" fill="#e6e8eb" font-weight="700">2.4%</text><text x="800" y="244" fill="#34d399">▼ 0.7</text>
