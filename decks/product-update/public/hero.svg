  <path d="M384 730 L440 712 496 716 552 690 608 676 664 682 720 640 776 620 832 628 888 580 944 560 1000 520 1056 500 1096 470" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round"/>
